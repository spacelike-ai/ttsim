# Builds the simulator on x86_64 and aarch64 to verify the public source remains buildable on every change.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Run Style Checker
      run: |
        scripts/check_style.py

    - name: Build Simulator
      run: |
        ./make.py :build

    - name: Hash Build Outputs
      run: |
        sha256sum src/_out/{debug,release}_{wh,bh}/libttsim.so

  # Builds on the ubuntu-22.04 release toolchain and attaches the wormhole and
  # blackhole libttsim binaries to the GitHub release, matching the asset names
  # (libttsim_wh.so / libttsim_bh.so) that tt-metal's fetch-ttsim job downloads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Run Style Checker
      run: |
        scripts/check_style.py

    - name: Build Simulator
      run: |
        ./make.py :build

    - name: Stage Release Binaries
      run: |
        mkdir -p dist
        cp src/_out/release_wh/libttsim.so dist/libttsim_wh.so
        cp src/_out/release_bh/libttsim.so dist/libttsim_bh.so
        sha256sum dist/libttsim_wh.so dist/libttsim_bh.so

    - name: Publish Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          dist/libttsim_wh.so dist/libttsim_bh.so \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --notes "Automated build of ${GITHUB_REF_NAME} (ubuntu-22.04 toolchain)."
